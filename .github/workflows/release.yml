name: DrillPaper release

# 推送 vX.Y.Z tag 時，從該 commit 乾淨建置、測試、打包 ZIP 與安裝檔，驗證後建立 GitHub Pre-release（票 18）。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Check tag, product version and release notes
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag 必須是 vX.Y.Z：$env:TAG" }
          $version = $Matches[1]
          $project = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'project\(DrillPaper VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if ($project -cne $version) { throw "Tag 版本 $version 與 CMake 專案版本 $project 不一致。" }
          if (-not (Test-Path -LiteralPath "docs/release-notes/$version.md")) { throw "缺少 docs/release-notes/$version.md。" }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG 已存在，不覆寫。" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # gh release view 查無 Release 時以 1 結束屬預期；明確回報成功，避免步驟沿用該 $LASTEXITCODE。
          exit 0
      - name: Restore pinned WebView2 SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          ./scripts/restore-webview2-sdk.ps1 -Destination $sdkRoot
          "WEBVIEW2_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: SDK and theme package tests
        shell: pwsh
        run: |
          npm run test:sdk
          if ($LASTEXITCODE -ne 0) { throw 'SDK 測試失敗。' }
          ./scripts/test-theme-package.ps1
          ./scripts/test-theme-negative-oracle.ps1
      - name: Build and run native tests
        shell: pwsh
        run: |
          cmake --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { throw '設定失敗。' }
          cmake --build --preset windows-msvc-release --config Release
          if ($LASTEXITCODE -ne 0) { throw '建置失敗。' }
          ctest --preset windows-msvc-release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw '原生測試失敗。' }
      - name: Packaging contract checks
        # 兩支契約測試失敗時會 throw；成功時不一定設定 $LASTEXITCODE。
        shell: pwsh
        run: |
          ./scripts/test-trial-package.ps1
          ./scripts/test-installer-package.ps1
          exit 0
      - name: Build archive from the tagged commit
        shell: pwsh
        run: |
          ./scripts/build-trial.ps1 -SourceCommit $env:GITHUB_SHA -Version $env:VERSION -OutputDirectory artifacts/release
          $archive = "artifacts/release/DrillPaper-$env:VERSION-win-x64.zip"
          ./scripts/verify-trial-archive.ps1 -ArchivePath $archive -SourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw '套件清單驗證失敗。' }
          $exe = Get-ChildItem artifacts/release -Recurse -Filter DrillPaper.exe | Where-Object FullName -like '*\build\Release\*' | Select-Object -First 1
          $reported = (& $exe.FullName --version | Out-String).Trim()
          if ($reported -cne "DrillPaper $env:VERSION") { throw "EXE 回報版本 '$reported' 與 $env:VERSION 不一致。" }
      - name: Build installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -ArchivePath "artifacts/release/DrillPaper-$env:VERSION-win-x64.zip" -SourceCommit $env:GITHUB_SHA -OutputDirectory artifacts/release
          if ($LASTEXITCODE -ne 0) { throw '安裝檔打包失敗。' }
      - name: Create GitHub Pre-release
        shell: pwsh
        run: |
          $assets = @(
            "artifacts/release/DrillPaper-$env:VERSION-Setup.exe",
            "artifacts/release/DrillPaper-$env:VERSION-Setup.json",
            "artifacts/release/DrillPaper-$env:VERSION-win-x64.zip",
            "artifacts/release/DrillPaper-$env:VERSION-win-x64.json")
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset)) { throw "缺少發布檔案：$asset" } }
          $sums = $assets | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_) }
          $sums | Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Encoding ascii
          gh release create $env:TAG @assets artifacts/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY `
            --prerelease --verify-tag --title "DrillPaper $env:VERSION" --notes-file "docs/release-notes/$env:VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw '建立 Release 失敗。' }
